{# Shared piece: the 'Event Category' checkboxes (Typhoon, Flood, Storm Surge...) #}
{# used on the Declare Disaster Event forms. #}
{% from "_macros.html" import icon with context %}
<div class="form-row">
    <label>Event Category</label>
    <p class="form-hint">Select all that apply.</p>
    <div class="declare-barangay-checklist event-category-list">
        {% for cat in EVENT_CATEGORIES %}
        <label class="declare-barangay-item">
            <input type="checkbox" name="event_category" value="{{ cat }}">
            <span class="declare-barangay-check">{{ icon('check', 13, 'white') }}</span>
            <span class="declare-barangay-name">{{ cat }}</span>
        </label>
        {% endfor %}
    </div>
</div>
