{# System Admin shared piece: the user-group tabs (All Users, PSWDO, CSWDO/MSWDO, Barangay) #}
{# above the activity log. A green dot means someone in that group is online now. #}
<div class="page-tabs">
    {% for g in groups %}
    <a href="{{ url_for(endpoint, role=g.key, q=search_query or None, module=module_filter if module_filter and module_filter != 'all' else None, date_from=date_from or None, date_to=date_to or None) }}" class="page-tab {{ 'active' if selected_group == g.key }}">
        {{ g.label }}{% if g.online %}<span class="online-dot" style="color:#1e8449;" title="Someone from this group is active now"></span>{% endif %}
    </a>
    {% endfor %}
</div>
